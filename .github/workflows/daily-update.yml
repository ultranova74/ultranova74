name: daily-update

on:
  schedule:
    - cron: "0 16 * * *"   # 北京时间每天 0:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update
        run: python update.py
      - name: Commit
        run: |
          git config user.name "daily-bot"
          git config user.email "bot@users.noreply.github.com"
          if git diff --quiet; then echo "no change"; exit 0; fi
          git add README.md
          git commit -m "每日精选更新 $(TZ=Asia/Shanghai date +%F)"
          git push
